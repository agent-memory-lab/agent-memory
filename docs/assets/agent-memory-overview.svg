<text x="68" y="58" class="kicker">AGENT MEMORY  /  SYSTEM ARCHITECTURE</text>
<text x="68" y="103" class="title">Evidence, interpretation, and usable memory.</text>
<text x="42" y="145" class="subtitle">A local-first modular core, with explicit integration and capability boundaries.</text>
<path d="M44 178H85" fill="none" stroke="#386b83" stroke-width="2" marker-end="url(#arrow)"/>
<text x="98" y="184" class="small">Primary data flow</text>
<path d="M291 178H332" fill="none" stroke="#386b83" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="345" y="184" class="small">Registered / opt-in path</text>
<text x="660" y="184" class="small">Core loop: no model key or background service required</text>
<text x="42" y="234" class="num">01</text>
<text x="82" y="234" class="section">Trusted host &amp; integration boundary</text>
<text x="82" y="261" class="small">The application owns identity, permissions, capture policy and model invocation.</text>
<rect x="42" y="280" width="1116" height="96" rx="12" fill="#e8eff3" stroke="#ccdae2"/>
<text x="64" y="314" class="kicker">HOST INPUTS</text>
<text x="64" y="346" class="body">Messages · Tools · Files</text>
<text x="440" y="314" class="kicker">ENTRY POINTS</text>
<text x="440" y="346" class="body">Python core / SDK</text>
<text x="780" y="314" class="kicker">OPTIONAL INTEGRATIONS</text>
<text x="780" y="346" class="body">MCP · LangGraph · Remote host</text>
<path d="M218 376V401" fill="none" stroke="#386b83" stroke-width="2" marker-end="url(#arrow)"/>
<text x="42" y="431" class="num">02</text>
<text x="82" y="431" class="section">Capture, interpret &amp; preserve history</text>
<text x="82" y="458" class="small">Source evidence and accepted interpretations remain distinct; summaries never elevate authority.</text>
<rect x="42" y="477" width="346" height="210" rx="12" fill="#ffffff" stroke="#ccd9df"/>
<text x="64" y="507" class="kicker">L0  /  EVIDENCE</text>
<text x="64" y="541" class="cardtitle">Durable source capture</text>
<text x="64" y="576" class="body">Content + source identity</text>
<text x="64" y="604" class="body">Revisions + deduplication</text>
<text x="64" y="632" class="body">Optional SDK outbox</text>
<path d="M64 644H366" stroke="#dce4e8"/>
<text x="64" y="669" class="small">Durable receive, replay &amp; reprocess</text>
<rect x="427" y="477" width="346" height="210" rx="12" fill="#ffffff" stroke="#ccd9df"/>
<text x="449" y="507" class="kicker">INTERPRETATION BOUNDARY</text>
<text x="449" y="541" class="cardtitle">Extraction &amp; admission</text>
<text x="449" y="576" class="body">Default: explicit metadata</text>
<text x="449" y="604" class="body">Opt-in: extract + typed review</text>
<text x="449" y="632" class="body">Accepted / pending / contested¹</text>
<path d="M449 644H751" stroke="#dce4e8"/>
<text x="449" y="669" class="small">Authority + field evidence checks</text>
<rect x="812" y="477" width="346" height="210" rx="12" fill="#ffffff" stroke="#ccd9df"/>
<text x="834" y="507" class="kicker">L1  /  ATOMIC MEMORY</text>
<text x="834" y="541" class="cardtitle">Versioned facts</text>
<text x="834" y="576" class="body">Provenance + qualifications</text>
<text x="834" y="604" class="body">Corrections + conditions</text>
<text x="834" y="632" class="body">valid_at × known_at</text>
<path d="M834 644H1136" stroke="#dce4e8"/>
<text x="834" y="669" class="small">Fact state is not task completion</text>
<path d="M388 575H417" fill="none" stroke="#386b83" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M773 575H802" fill="none" stroke="#386b83" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M985 687V716H22V879H33" fill="none" stroke="#386b83" stroke-width="2" marker-end="url(#arrow)"/>
<text x="430" y="707" class="small">L1 state + L0 source evidence</text>
<text x="42" y="742" class="num">03</text>
<text x="82" y="742" class="section">Retrieve, govern &amp; deliver</text>
<text x="82" y="769" class="small">L1 supports direct reads. Retrieval remains bounded by host scope, query time and current access.</text>
<rect x="42" y="788" width="346" height="184" rx="12" fill="#ffffff" stroke="#ccd9df"/>
<text x="64" y="818" class="kicker">CANDIDATE RETRIEVAL</text>
<text x="64" y="852" class="cardtitle">Find relevant evidence</text>
<text x="64" y="887" class="body">Temporal state + source reads</text>
<text x="64" y="915" class="body">Optional lexical / hybrid search</text>
<path d="M64 929H366" stroke="#dce4e8"/>
<text x="64" y="954" class="small">Default RRF · optional rerank</text>
<rect x="427" y="788" width="346" height="184" rx="12" fill="#ffffff" stroke="#ccd9df"/>
<text x="449" y="818" class="kicker">CONTROLLED DELIVERY</text>
<text x="449" y="852" class="cardtitle">Filter, pack &amp; recheck</text>
<text x="449" y="887" class="body">Scope / time / evidence checks</text>
<text x="449" y="915" class="body">Diversity + item / token budgets</text>
<path d="M449 929H751" stroke="#dce4e8"/>
<text x="449" y="954" class="small">Final permission &amp; erasure guard</text>
<rect x="812" y="788" width="346" height="184" rx="12" fill="#16394a" stroke="#16394a"/>
<text x="834" y="818" class="kicker" style="fill:#afcedb">HOST-READY OUTPUT</text>
<text x="834" y="852" class="cardtitle" style="fill:#ffffff">MemoryBundle</text>
<text x="834" y="887" class="body" style="fill:#e4eff3">Facts + relevant memory</text>
<text x="834" y="915" class="body" style="fill:#e4eff3">Citations + bounded context</text>
<path d="M834 929H1136" stroke="#466372"/>
<text x="834" y="954" class="small" style="fill:#c8dce6">Host assembles the model request</text>
<path d="M388 879H417" fill="none" stroke="#386b83" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M773 879H802" fill="none" stroke="#386b83" stroke-width="2" marker-end="url(#arrow)"/>
<text x="42" y="1033" class="num">04</text>
<text x="82" y="1033" class="section">Registered knowledge projections</text>
<text x="82" y="1060" class="small">Opt-in, supported templates and registered coverage — not a mandatory L1 → L2 → L3 pipeline.</text>
<rect x="42" y="1078" width="1116" height="37" rx="7" fill="#e9eef7" stroke="#d3dceb"/>
<text x="63" y="1103" class="small">INPUTS: admitted L1 / supported fixed parent revisions · complete lineage · guarded reads</text>
<path d="M215 1115V1137" fill="none" stroke="#386b83" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M600 1115V1137" fill="none" stroke="#386b83" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M985 1115V1137" fill="none" stroke="#386b83" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="42" y="1147" width="346" height="214" rx="12" fill="#ffffff" stroke="#ccd9df"/>
<text x="64" y="1177" class="kicker">OBSERVATION → L2</text>
<text x="64" y="1211" class="cardtitle">Language views</text>
<text x="64" y="1246" class="body">Same-scope language facets</text>
<text x="64" y="1274" class="body">Conditions + bounded history</text>
<text x="64" y="1302" class="body">Supported parents → L2 pages</text>
<path d="M64 1318H366" stroke="#dce4e8"/>
<text x="64" y="1343" class="small">Versioned pages &amp; stable blocks</text>
<rect x="427" y="1147" width="346" height="214" rx="12" fill="#ffffff" stroke="#ccd9df"/>
<text x="449" y="1177" class="kicker">QUESTIONVIEWS → L2</text>
<text x="449" y="1211" class="cardtitle">Project questions</text>
<text x="449" y="1246" class="body">Registered questions + relations</text>
<text x="449" y="1274" class="body">Owners / commitments / risks</text>
<text x="449" y="1302" class="body">Maintained scenes + history²</text>
<path d="M449 1318H751" stroke="#dce4e8"/>
<text x="449" y="1343" class="small">Full / delta answers &amp; proof reuse</text>
<rect x="812" y="1147" width="346" height="214" rx="12" fill="#ffffff" stroke="#ccd9df"/>
<text x="834" y="1177" class="kicker">L3  /  PERSONA</text>
<text x="834" y="1211" class="cardtitle">Reviewed Persona</text>
<text x="834" y="1246" class="body">Declarations ≠ hypotheses</text>
<text x="834" y="1274" class="body">Independent evidence + spans</text>
<text x="834" y="1302" class="body">Counterexamples + withdrawal</text>
<path d="M834 1318H1136" stroke="#dce4e8"/>
<text x="834" y="1343" class="small">Immutable revisions &amp; host policy</text>
<text x="42" y="1420" class="num">05</text>
<text x="82" y="1420" class="section">Optional intelligence &amp; host-driven execution</text>
<text x="82" y="1447" class="small">Explicit adapters and budgets; no unbounded autonomy, new fact authority or implicit default enablement.</text>
<rect x="42" y="1463" width="539" height="143" rx="12" fill="#ffffff" stroke="#ccd9df"/>
<text x="64" y="1493" class="kicker">BOUNDED READ EXTENSION</text>
<text x="64" y="1527" class="cardtitle">EvidenceResearch / Reflect</text>
<text x="64" y="1562" class="body">Frozen scope + finite rounds + citations</text>
<text x="64" y="1590" class="body">Reuses retrieval guards; no memory publication</text>
<rect x="619" y="1463" width="539" height="143" rx="12" fill="#ffffff" stroke="#ccd9df"/>
<text x="641" y="1493" class="kicker">OPTIONAL MODEL ADAPTERS</text>
<text x="641" y="1527" class="cardtitle">Governed providers</text>
<text x="641" y="1562" class="body">Extraction / review / registered refresh adapters</text>
<text x="641" y="1590" class="body">Reservations, exact cache &amp; accountable costs</text>
<rect x="42" y="1625" width="346" height="160" rx="12" fill="#ffffff" stroke="#ccd9df"/>
<text x="64" y="1655" class="kicker">CONTEXT / OPT-IN</text>
<text x="64" y="1689" class="cardtitle">Source recovery</text>
<text x="64" y="1724" class="body">Version-bound source excerpts</text>
<text x="64" y="1752" class="body">Guarded recovery, not a copy store</text>
<rect x="427" y="1625" width="346" height="160" rx="12" fill="#ffffff" stroke="#ccd9df"/>
<text x="449" y="1655" class="kicker">ONTOLOGY / EXTENSIONS</text>
<text x="449" y="1689" class="cardtitle">Typed relations &amp; plugins</text>
<text x="449" y="1724" class="body">Schema + bounded projections</text>
<text x="449" y="1752" class="body">Trusted in-process extensions</text>
<rect x="812" y="1625" width="346" height="160" rx="12" fill="#ffffff" stroke="#ccd9df"/>
<text x="834" y="1655" class="kicker">EVOLUTION / GATED</text>
<text x="834" y="1689" class="cardtitle">Evaluated procedures</text>
<text x="834" y="1724" class="body">Offline → shadow → canary</text>
<text x="834" y="1752" class="body">Explicit approval + rollback</text>
<text x="42" y="1840" class="num">06</text>
<text x="82" y="1840" class="section">Shared runtime &amp; persistence</text>
<text x="82" y="1867" class="small">One coordinated lifecycle — not a separate scheduler or database for each projection.</text>
<rect x="42" y="1879" width="1116" height="73" rx="12" fill="#e7eef1" stroke="#cbd9e0"/>
<text x="64" y="1909" class="body">RefreshHost · Durable tasks · Leases · Retry / replay · Publication · Index coverage / repair</text>
<text x="64" y="1935" class="small">SQLite core  |  Optional PostgreSQL / vector support  |  Controlled backup + deletion-log replay</text>
<rect x="42" y="1971" width="1116" height="55" rx="12" fill="#16394a" stroke="#16394a"/>
<text x="64" y="2005" class="body" style="fill:#ffffff">ACROSS SUPPORTED PATHS   Scope &amp; authority  ·  Provenance  ·  Two clocks  ·  Erasure</text>
<text x="42" y="2050" class="tiny">¹ Typed admission outcomes.   ² Registered historical coverage only.   Alpha: production/domain acceptance remains open.</text>
