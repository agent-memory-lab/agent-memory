<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660" role="img" aria-labelledby="title desc">
  <title id="title">Agent Memory: from source evidence to usable memory</title>
  <desc id="desc">The implemented path runs from a trusted host through L0 source evidence and typed admission or review to L1 versioned facts. L1 supports direct current and historical fact reads into a bounded MemoryBundle. Optional same-scope language Observations support bounded historical reads and current non-conditional parent views. Current L2 language pages support full rebuild from fixed same-scope non-conditional language parents. General scenario templates and L3 Core or Persona remain planned. Evidence, time, scope and erasure govern these paths, supported by durable intake, replay, retries, staged readiness and restore controls. Conditional or historical parents, historical pages, delta and cross-scope composition are not enabled.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#d9d2c5" stroke-width=".7"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L7 4L1 7" fill="none" stroke="#1f5b45" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="planned-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L7 4L1 7" fill="none" stroke="#868a7d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif}
      .eyebrow{font-size:12px;font-weight:700;letter-spacing:1.8px;fill:#5d6258}
      .heading{font-size:40px;font-weight:700;letter-spacing:-1.2px;fill:#171f19}
      .subtitle{font-size:18px;fill:#596255}
      .step{font-size:12px;font-weight:700;letter-spacing:1.3px;fill:#1f5b45}
      .card-title{font-size:22px;font-weight:700;letter-spacing:-.5px;fill:#171f19}
      .body{font-size:16px;fill:#596255}
      .small{font-size:14px;fill:#596255}
      .mono{font-family:'Courier New',monospace;font-size:14px;fill:#1f5b45}
      .guard{font-size:16px;font-weight:700;fill:#f6f2e9}
      .guard-note{font-size:12px;fill:#bfd0c1}
      .connection{fill:none;stroke:#1f5b45;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>

  <!-- Opaque paper keeps the same contrast in GitHub light and dark themes. -->
  <rect width="1280" height="660" rx="18" fill="#f5f0e7"/>
  <rect x="1" y="1" width="1278" height="658" rx="17" fill="url(#grid)" opacity=".3"/>
  <rect x="1" y="1" width="1278" height="658" rx="17" fill="none" stroke="#d6d1c5"/>

  <path d="M56 52H82" stroke="#e65d3f" stroke-width="4" stroke-linecap="round"/>
  <text x="94" y="56" class="eyebrow">AGENT MEMORY / SYSTEM OVERVIEW</text>
  <text x="56" y="115" class="heading">From evidence to usable memory.</text>
  <text x="56" y="149" class="subtitle">Traceable facts. Bounded context. Explicit control.</text>

  <!-- The direct L1 read path is independent of optional derived layers. -->
  <path d="M188 280H218" class="connection"/>
  <path d="M420 280H450" class="connection"/>
  <path d="M626 280H656" class="connection"/>
  <path d="M908 280H938" class="connection"/>

  <g transform="translate(56 198)">
    <rect width="132" height="172" rx="12" fill="#ebe8df" stroke="#c8c9bd"/>
    <text x="18" y="30" class="step">HOST</text>
    <text x="18" y="70" class="card-title">Agent</text>
    <text x="18" y="111" class="body">Messages</text>
    <text x="18" y="137" class="body">Tools · files</text>
  </g>

  <g transform="translate(230 198)">
    <rect width="190" height="172" rx="12" fill="#fffdf8" stroke="#b9c4b8"/>
    <text x="20" y="30" class="step">L0 / SOURCE</text>
    <text x="20" y="70" class="card-title">Evidence</text>
    <text x="20" y="111" class="body">Original + versions</text>
    <text x="20" y="137" class="body">Durable intake</text>
  </g>

  <g transform="translate(462 211)">
    <rect width="164" height="146" rx="12" fill="#f5e0d6" stroke="#d89b83"/>
    <text x="20" y="29" class="step" style="fill:#9b452d">ADMISSION</text>
    <text x="20" y="68" class="card-title" style="font-size:20px">Typed review</text>
    <text x="20" y="108" class="small">Evidence → decision</text>
  </g>

  <g transform="translate(668 198)">
    <rect width="240" height="172" rx="12" fill="#e5ede2" stroke="#1f5b45" stroke-width="1.5"/>
    <rect x="20" y="23" width="5" height="12" rx="2.5" fill="#1f5b45"/>
    <text x="35" y="33" class="step">L1 / ATOM</text>
    <text x="20" y="70" class="card-title">Versioned facts</text>
    <text x="20" y="111" class="body">Evidence + decisions</text>
    <text x="20" y="138" class="mono">valid_at · known_at</text>
  </g>

  <g transform="translate(950 198)">
    <rect width="274" height="172" rx="12" fill="#1f5b45"/>
    <text x="22" y="30" class="step" style="fill:#bed5c2">DIRECT FACT READS</text>
    <text x="22" y="70" class="card-title" style="fill:#fffdf8">MemoryBundle</text>
    <text x="22" y="111" class="body" style="fill:#e4ede0">Current + historical facts</text>
    <text x="22" y="137" class="body" style="fill:#e4ede0">Bounded context for the host</text>
  </g>

  <!-- Observation is a facet projection, not a new product layer. -->
  <path d="M788 370V397" class="connection"/>
  <g transform="translate(556 408)">
    <rect width="352" height="102" rx="12" fill="#fffdf8" stroke="#b9c4b8"/>
    <text x="20" y="25" class="step">OBSERVATION / OPTIONAL</text>
    <text x="20" y="55" class="card-title">Language preference</text>
    <text x="20" y="80" class="small">Same scope · current + bounded history</text>
  </g>

  <path d="M908 459H938" fill="none" stroke="#868a7d" stroke-width="1.7" stroke-dasharray="4 4" marker-end="url(#planned-arrow)"/>
  <g transform="translate(950 408)">
    <rect width="274" height="102" rx="12" fill="#eeece3" stroke="#9ba08f" stroke-dasharray="5 4"/>
    <text x="20" y="25" class="step" style="fill:#6d745f">DERIVED KNOWLEDGE</text>
    <text x="20" y="56" class="body" style="font-weight:700;fill:#485142">L2 current language pages</text>
    <text x="20" y="81" class="body" style="font-weight:700;fill:#485142">L3 Core / Persona · planned</text>
  </g>

  <g transform="translate(56 429)">
    <path d="M0 0V55H22" fill="none" stroke="#c5c9bb" stroke-width="1.5"/>
    <text x="18" y="7" class="eyebrow">FACTS STAY TRACEABLE</text>
    <text x="18" y="32" class="small">Derived views keep their input dependencies.</text>
    <text x="34" y="60" class="small">The same evidence and permissions still apply.</text>
  </g>

  <!-- The controls apply across intake, publication, reads and derived views. -->
  <g transform="translate(56 540)">
    <rect width="1168" height="70" rx="12" fill="#223a2e"/>
    <text x="22" y="39" class="eyebrow" style="fill:#bfd0c1">ACROSS EVERY PATH</text>
    <path d="M221 17V53M449 17V53M677 17V53M905 17V53" stroke="#496150"/>
    <text x="247" y="29" class="guard">Evidence</text>
    <text x="247" y="49" class="guard-note">Source-backed decisions</text>
    <text x="475" y="29" class="guard">Time</text>
    <text x="475" y="49" class="guard-note">Validity + knowledge history</text>
    <text x="703" y="29" class="guard">Scope</text>
    <text x="703" y="49" class="guard-note">Host-bound permissions</text>
    <text x="931" y="29" class="guard">Erasure</text>
    <text x="931" y="49" class="guard-note">Deletion + restore barriers</text>
  </g>
  <circle cx="62" cy="634" r="3" fill="#e65d3f"/>
  <text x="76" y="638" class="eyebrow" style="font-size:11px;letter-spacing:1px">RELIABLE EXECUTION</text>
  <text x="266" y="638" class="small">Durable tasks · Replay and retry · Staged readiness · Recoverable operations</text>
</svg>
