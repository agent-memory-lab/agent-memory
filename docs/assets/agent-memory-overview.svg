<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2070" viewBox="0 0 1200 2070" role="img" aria-labelledby="title desc">
<title id="title">Agent Memory — system architecture and capability boundaries</title>
<desc id="desc">A layered architecture of trusted host integrations, durable L0 evidence, explicit metadata or opt-in typed extraction and admission, temporal L1 facts, scoped retrieval and bounded MemoryBundle delivery. Registered derived paths include language Observations and L2 pages, project QuestionViews and L2 scenes, and reviewed L3 Persona. Optional research and model extensions do not replace the default local loop. Shared runtime and storage provide durable refresh, recovery, indexing and erasure. Scope, provenance, two clocks and current deletion guards apply across supported paths.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#386b83" stroke-width="1.7"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#183749}.title{font-size:39px;font-weight:700;letter-spacing:-1px}.subtitle{font-size:21px;fill:#536b79}.section{font-size:25px;font-weight:700}.num{font-size:19px;font-weight:700;fill:#527a90}.kicker{font-size:14px;font-weight:700;letter-spacing:1.2px;fill:#496d81}.cardtitle{font-size:25px;font-weight:700;letter-spacing:-.3px}.body{font-size:20px;fill:#425e6d}.small{font-size:17px;fill:#627885}.tiny{font-size:15px;fill:#627885} </style></defs>
