<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
  <title id="title">Agent Memory plugin integration flow</title>
  <desc id="desc">A six-step integration flow showing that an agent can replace memory providers without changing agent code.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#d2cabd"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#171914"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#171914" flood-opacity=".11"/>
    </filter>
    <style>
      .eyebrow{font:700 14px 'Arial Narrow',Arial,sans-serif;letter-spacing:2px;fill:#5d6258}
      .title{font:900 40px 'Arial Narrow',Arial,sans-serif;fill:#171914}
      .num{font:900 16px 'Arial Narrow',Arial,sans-serif;fill:#fffdf8}
      .cardTitle{font:800 19px 'Arial Narrow',Arial,sans-serif;fill:#171914}
      .body{font:400 14px Arial,sans-serif;fill:#4c5148}
      .mono{font:600 12px 'Courier New',monospace;fill:#171914}
      .footer{font:800 15px 'Arial Narrow',Arial,sans-serif;letter-spacing:1px;fill:#fffdf8}
    </style>
  </defs>

  <rect width="1440" height="620" fill="#f5f0e7"/>
  <rect width="1440" height="620" fill="url(#dots)"/>
  <rect x="24" y="24" width="1392" height="572" rx="22" fill="none" stroke="#171914" stroke-width="2"/>

  <text x="70" y="79" class="eyebrow">PLUGIN CONTRACT / INTEGRATION PATH</text>
  <text x="70" y="125" class="title">CONNECT ONCE. REPLACE INFRASTRUCTURE LATER.</text>

  <path d="M150 242H1290" stroke="#171914" stroke-width="3"/>

  <g transform="translate(64 182)" filter="url(#shadow)">
    <rect width="200" height="260" rx="14" fill="#fffdf8" stroke="#171914" stroke-width="2"/>
    <circle cx="100" cy="60" r="28" fill="#171914"/>
    <text x="100" y="66" text-anchor="middle" class="num">01</text>
    <text x="20" y="116" class="cardTitle">Install</text>
    <text x="20" y="143" class="body">Add only the package</text>
    <text x="20" y="165" class="body">required by this host.</text>
    <rect x="20" y="191" width="160" height="42" rx="7" fill="#ece7dc"/>
    <text x="32" y="216" class="mono">pip install ...</text>
  </g>

  <path d="M270 312H292" stroke="#171914" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(298 182)" filter="url(#shadow)">
    <rect width="200" height="260" rx="14" fill="#fffdf8" stroke="#171914" stroke-width="2"/>
    <circle cx="100" cy="60" r="28" fill="#1f5b45"/>
    <text x="100" y="66" text-anchor="middle" class="num">02</text>
    <text x="20" y="116" class="cardTitle">Discover</text>
    <text x="20" y="143" class="body">Entry points are loaded</text>
    <text x="20" y="165" class="body">lazily by plugin name.</text>
    <rect x="20" y="191" width="160" height="42" rx="7" fill="#dce9e2"/>
    <text x="32" y="216" class="mono">providers: postgres</text>
  </g>

  <path d="M504 312H526" stroke="#171914" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(532 182)" filter="url(#shadow)">
    <rect width="200" height="260" rx="14" fill="#fffdf8" stroke="#171914" stroke-width="2"/>
    <circle cx="100" cy="60" r="28" fill="#e65d3f"/>
    <text x="100" y="66" text-anchor="middle" class="num">03</text>
    <text x="20" y="116" class="cardTitle">Resolve</text>
    <text x="20" y="143" class="body">Create a provider behind</text>
    <text x="20" y="165" class="body">the stable contract.</text>
    <rect x="20" y="191" width="160" height="42" rx="7" fill="#f5dfd8"/>
    <text x="32" y="216" class="mono">from_plugin(name)</text>
  </g>

  <path d="M738 312H760" stroke="#171914" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(766 182)" filter="url(#shadow)">
    <rect width="200" height="260" rx="14" fill="#fffdf8" stroke="#171914" stroke-width="2"/>
    <circle cx="100" cy="60" r="28" fill="#315d80"/>
    <text x="100" y="66" text-anchor="middle" class="num">04</text>
    <text x="20" y="116" class="cardTitle">Scope</text>
    <text x="20" y="143" class="body">The trusted host injects</text>
    <text x="20" y="165" class="body">identity boundaries.</text>
    <rect x="20" y="191" width="160" height="42" rx="7" fill="#dfe8ef"/>
    <text x="32" y="216" class="mono">tenant / user / session</text>
  </g>

  <path d="M972 312H994" stroke="#171914" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(1000 182)" filter="url(#shadow)">
    <rect width="200" height="260" rx="14" fill="#fffdf8" stroke="#171914" stroke-width="2"/>
    <circle cx="100" cy="60" r="28" fill="#8a6c2f"/>
    <text x="100" y="66" text-anchor="middle" class="num">05</text>
    <text x="20" y="116" class="cardTitle">Use</text>
    <text x="20" y="143" class="body">Agent hooks call one</text>
    <text x="20" y="165" class="body">framework-neutral API.</text>
    <rect x="20" y="191" width="160" height="42" rx="7" fill="#eee3c8"/>
    <text x="32" y="216" class="mono">remember / recall</text>
  </g>

  <path d="M1206 312H1228" stroke="#171914" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(1234 182)" filter="url(#shadow)">
    <rect width="142" height="260" rx="14" fill="#171914" stroke="#171914" stroke-width="2"/>
    <circle cx="71" cy="60" r="28" fill="#fffdf8"/>
    <text x="71" y="66" text-anchor="middle" style="font:900 16px Arial;fill:#171914">06</text>
    <text x="18" y="116" style="font:800 19px Arial;fill:#fffdf8">Replace</text>
    <text x="18" y="143" style="font:400 14px Arial;fill:#d7d5cf">Swap storage</text>
    <text x="18" y="165" style="font:400 14px Arial;fill:#d7d5cf">without agent</text>
    <text x="18" y="187" style="font:400 14px Arial;fill:#d7d5cf">code changes.</text>
  </g>

  <g transform="translate(64 493)">
    <rect width="1312" height="65" rx="12" fill="#171914"/>
    <text x="28" y="40" class="footer">AGENT CODE</text>
    <text x="184" y="40" style="font:400 15px Arial;fill:#b9bcb5">depends on</text>
    <text x="286" y="40" class="footer">MEMORYPROVIDER</text>
    <text x="476" y="40" style="font:400 15px Arial;fill:#b9bcb5">not on</text>
    <text x="553" y="40" class="footer">SQLITE</text>
    <text x="664" y="40" class="footer">POSTGRES</text>
    <text x="809" y="40" class="footer">MCP</text>
    <text x="885" y="40" class="footer">LANGGRAPH</text>
    <text x="1050" y="40" class="footer">OR FUTURE PLUGINS</text>
  </g>
</svg>
