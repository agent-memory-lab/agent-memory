<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2070" viewBox="0 0 1200 2070" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">Agent Memory — 系统架构与能力边界</title>
<desc id="desc">分层架构展示可信宿主接入、持久化 L0 证据、默认显式元数据或可选抽取与类型化接纳、双时态 L1 事实，以及受控检索与有界 MemoryBundle 交付。注册派生路径包括语言 Observation 和 L2 页面、项目 QuestionView 和 L2 场景，以及经复核的 L3 Persona。可选研究、模型、本体、上下文恢复与门控演进不替代默认本地闭环。共享运行时与存储负责刷新、恢复、索引和擦除；作用域、来源血缘、双时态与当前删除屏障贯穿所有支持路径。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#386b83" stroke-width="1.7" /></marker>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#183749}.title{font-size:39px;font-weight:700;letter-spacing:-1px}.subtitle{font-size:21px;fill:#536b79}.section{font-size:25px;font-weight:700}.num{font-size:19px;font-weight:700;fill:#527a90}.kicker{font-size:14px;font-weight:700;letter-spacing:.6px;fill:#496d81}.cardtitle{font-size:25px;font-weight:700;letter-spacing:-.3px}.body{font-size:20px;fill:#425e6d}.small{font-size:17px;fill:#627885}.tiny{font-size:15px;fill:#627885} </style></defs>
<rect x="0" y="0" width="1200" height="2070" rx="20" fill="#f3f6f8" stroke="#d5e0e5" />
