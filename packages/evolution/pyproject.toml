[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-memory-evolution"
version = "0.1.0"
description = "Controlled evaluation, promotion, and rollback for agent-memory procedures"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
dependencies = ["agent-memory>=0.1,<0.2"]

[project.entry-points."agent_memory.integrations"]
evolution = "agent_memory_evolution:EvolutionEngine"

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_memory_evolution"]
