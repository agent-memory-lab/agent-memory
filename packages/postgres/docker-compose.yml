services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: agent_memory
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: memory
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory -d agent_memory"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - agent-memory-postgres:/var/lib/postgresql/data

volumes:
  agent-memory-postgres:
