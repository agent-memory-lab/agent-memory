[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-memory-postgres"
version = "0.1.0"
description = "PostgreSQL and pgvector provider for agent-memory"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "agent-memory>=0.1,<0.2",
  "psycopg[binary,pool]>=3.2,<4",
]

[project.optional-dependencies]
release = ["build>=1,<2"]

[project.entry-points."agent_memory.providers"]
postgres = "agent_memory_postgres:build_postgres_kernel"

[project.scripts]
agent-memory-consolidate = "agent_memory_postgres.worker:main"
agent-memory-health = "agent_memory_postgres.health:main"
agent-memory-sensitive-scan = "agent_memory_postgres.sensitivity:main"
agent-memory-release-scan = "agent_memory_postgres.release_scan:main"
agent-memory-preflight = "agent_memory_postgres.preflight:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_memory_postgres"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "agent_memory_postgres/migrations"
