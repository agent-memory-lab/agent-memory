[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-memory-langgraph"
version = "0.1.0"
description = "LangGraph lifecycle adapter for agent-memory"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
dependencies = ["agent-memory>=0.1,<0.2", "langgraph>=1"]

[project.entry-points."agent_memory.integrations"]
langgraph = "agent_memory_langgraph:LangGraphMemoryAdapter"

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_memory_langgraph"]
