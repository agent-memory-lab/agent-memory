name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: |
          python -m pip install -e '.[dev]'
          python -m pip install -e packages/python-sdk
          python -m pip install -e 'packages/mcp-server[dev]'
          python -m pip install -e packages/postgres
      - run: python -m pytest -q tests

  integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: |
          python -m pip install -e '.[dev]'
          python -m pip install -e packages/evolution
          python -m pip install -e packages/langgraph
          python -m pip install -e packages/python-sdk
          python -m pip install -e 'packages/mcp-server[dev]'
          python -m pip install -e packages/postgres
      - run: >-
          python -m pytest -q
          packages/evolution/tests
          packages/langgraph/tests
          packages/python-sdk/tests
          packages/mcp-server/tests
          tests/test_derived_observations.py::test_readonly_transports_and_final_delivery_recheck
          tests/test_publication_batches.py::test_every_token_and_continuous_prefix_must_be_covered

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install build
      - run: |
          for package in . packages/evolution packages/langgraph packages/python-sdk packages/mcp-server packages/postgres; do
            python -m build "$package"
          done
      - name: Install and verify all built wheels outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/wheel-install"
          "$RUNNER_TEMP/wheel-install/bin/python" -m pip install dist/*.whl packages/*/dist/*.whl
          "$RUNNER_TEMP/wheel-install/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-install/bin/python" -I "$GITHUB_WORKSPACE/tests/operational/v7_installed_smoke.py" --source-root "$GITHUB_WORKSPACE"
      - name: Scan source and all build archives without lowering the threshold
        run: |
          "$RUNNER_TEMP/wheel-install/bin/agent-memory-release-scan" --json --fail-on-violation .

  postgres-live:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: memory
          POSTGRES_PASSWORD: memory-test-password
          POSTGRES_DB: agent_memory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memory -d agent_memory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AGENT_MEMORY_TEST_POSTGRES_DSN: >-
        postgresql://memory:memory-test-password@localhost:5432/agent_memory_test
      AGENT_MEMORY_ONTOLOGY_TEST_DSN: >-
        postgresql://memory:memory-test-password@localhost:5432/agent_memory_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Use PostgreSQL 17 backup clients
        run: |
          # Official PGDG repository: https://www.postgresql.org/download/linux/ubuntu/
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          . /etc/os-release
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' "$VERSION_CODENAME" | sudo tee /etc/apt/sources.list.d/pgdg.sources
          sudo apt-get update -qq
          sudo apt-get install --yes postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/psql --version
      - run: |
          python -m pip install -e '.[dev]' tiktoken==0.14.0
          python -m pip install -e packages/evolution -e packages/langgraph
          python -m pip install -e packages/postgres -e packages/python-sdk
          python -m pip install -e 'packages/mcp-server[dev]'
      - name: Complete repository and package contracts on both real backends
        run: >-
          python -m pytest -q tests packages/evolution/tests packages/langgraph/tests
          packages/python-sdk/tests packages/mcp-server/tests packages/postgres/tests
          --junitxml=full-dual.xml -ra
      - name: Actual pre-V7 source upgrade and quiescent rollback probe
        run: |
          git fetch --depth=1 origin 7f824dd49b18935c6b47f5eb32aa32efdbd8cf01
          export AGENT_MEMORY_LEGACY_SOURCE="$RUNNER_TEMP/pre-v7-source"
          mkdir "$AGENT_MEMORY_LEGACY_SOURCE"
          git archive 7f824dd49b18935c6b47f5eb32aa32efdbd8cf01 | tar -x -C "$AGENT_MEMORY_LEGACY_SOURCE"
          python -m pytest -q tests/operational/v7_upgrade_drill.py --junitxml=version-drill.xml -ra
      - name: Preserve complete backend test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-live-backend-evidence
          path: |
            full-dual.xml
            version-drill.xml
          if-no-files-found: warn
