name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: |
          python -m pip install -e '.[dev]'
          python -m pip install -e packages/python-sdk
          python -m pip install -e 'packages/mcp-server[dev]'
          python -m pip install -e packages/postgres
      - run: python -m pytest -q tests

  integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: |
          python -m pip install -e '.[dev]'
          python -m pip install -e packages/evolution
          python -m pip install -e packages/langgraph
          python -m pip install -e packages/python-sdk
          python -m pip install -e 'packages/mcp-server[dev]'
          python -m pip install -e packages/postgres
      - run: >-
          python -m pytest -q
          packages/evolution/tests
          packages/langgraph/tests
          packages/python-sdk/tests
          packages/mcp-server/tests
          tests/test_derived_observations.py::test_readonly_transports_and_final_delivery_recheck
          tests/test_publication_batches.py::test_every_token_and_continuous_prefix_must_be_covered

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install build
      - run: |
          for package in . packages/evolution packages/langgraph packages/python-sdk packages/mcp-server packages/postgres; do
            python -m build "$package"
          done

  postgres-live:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: memory
          POSTGRES_PASSWORD: memory-test-password
          POSTGRES_DB: agent_memory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memory -d agent_memory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AGENT_MEMORY_TEST_POSTGRES_DSN: >-
        postgresql://memory:memory-test-password@localhost:5432/agent_memory_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Use PostgreSQL 17 backup clients
        run: |
          # Official PGDG repository: https://www.postgresql.org/download/linux/ubuntu/
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          . /etc/os-release
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' "$VERSION_CODENAME" | sudo tee /etc/apt/sources.list.d/pgdg.sources
          sudo apt-get update -qq
          sudo apt-get install --yes postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/psql --version
      - run: |
          python -m pip install -e '.[dev]'
          python -m pip install -e packages/postgres
          python -m pip install -e packages/python-sdk
          python -m pip install -e 'packages/mcp-server[dev]'
      - run: >-
          python -m pytest -q packages/postgres/tests
          tests/test_bitemporal_claims.py tests/test_atom_admission.py tests/test_atom_temporal.py
          tests/test_atom_edges.py tests/test_atom_extraction.py
          tests/test_durable_retention.py tests/test_durable_execution.py
          tests/test_durable_producer.py tests/test_durable_transport.py
          tests/test_reprocessing.py tests/test_source_revisions.py
          tests/test_contextual_memory.py tests/test_artifact_erasure.py
          tests/test_derived_*.py tests/test_purge_restore.py tests/test_durable_purge.py
          tests/test_v7_subscriptions.py tests/test_v7_backend_lifecycle.py
          tests/test_refresh*.py
          tests/test_project_admission_v7.py tests/test_project_questions_v7.py
          tests/test_question_runtime_v7.py tests/test_question_transport_v7.py
          tests/test_question_pages_v7.py tests/test_question_erasure_v7.py
          tests/test_question_snapshot_security_v7.py
          tests/test_governed_models_v7.py tests/test_model_budget_v7.py
          tests/test_ollama_port_v7.py tests/test_model_budget_recovery_v7.py
          tests/test_model_cost_runtime_v7.py tests/test_question_models_v7.py
          tests/test_b5_independent_security_v7.py
          tests/test_question_delta_v7.py tests/test_question_proof_reuse_v7.py
          tests/test_question_page_validation_v7.py tests/test_b4_adversarial_review.py
          tests/test_v7_project_indexes.py tests/test_v7_qualified_pages.py
