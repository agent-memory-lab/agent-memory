name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: |
          python -m pip install -e '.[dev]'
          python -m pip install -e packages/python-sdk
      - run: python -m pytest -q tests

  integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: |
          python -m pip install -e '.[dev]'
          python -m pip install -e packages/evolution
          python -m pip install -e packages/langgraph
          python -m pip install -e packages/python-sdk
          python -m pip install -e packages/mcp-server
      - run: >-
          python -m pytest -q
          packages/evolution/tests
          packages/langgraph/tests
          packages/python-sdk/tests
          packages/mcp-server/tests

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install build
      - run: |
          for package in . packages/evolution packages/langgraph packages/python-sdk packages/mcp-server packages/postgres; do
            python -m build "$package"
          done

  postgres-live:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: memory
          POSTGRES_PASSWORD: memory-test-password
          POSTGRES_DB: agent_memory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memory -d agent_memory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AGENT_MEMORY_TEST_POSTGRES_DSN: >-
        postgresql://memory:memory-test-password@localhost:5432/agent_memory_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: |
          python -m pip install -e '.[dev]'
          python -m pip install -e packages/postgres
      - run: python -m pytest -q packages/postgres/tests/test_live_contract.py
