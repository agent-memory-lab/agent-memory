name: Container

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Validate package versions
        id: metadata
        run: python tools/container_release.py metadata
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: agent-memory-smoke:ci
      - name: Installed MCP, HTTP authentication, restart, isolation and deletion
        run: >-
          python tools/container_lifecycle_smoke.py --image agent-memory-smoke:ci
          --platform linux/${{ matrix.arch }} --expected-version ${{ steps.metadata.outputs.version }}
          --seed-image ghcr.io/agent-memory-lab/agent-memory@sha256:c4d1c54dcbc56205e62dd6770ed420ed30d74820110f7d14408c37bc4f1b1704
          --seed-version 0.1.1
      - name: Scan OS and Python dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: agent-memory-smoke:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: json
          output: trivy-${{ matrix.arch }}.json
          timeout: 10m
      - name: Preserve vulnerability evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-scan-${{ matrix.arch }}
          path: trivy-${{ matrix.arch }}.json
          if-no-files-found: warn

  publish:
    if: >-
      github.repository == 'agent-memory-lab/agent-memory' &&
      github.event_name != 'pull_request' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    concurrency:
      group: agent-memory-container-publication
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Require the exact version tag on main history
        id: metadata
        run: python tools/container_release.py metadata --published
      - name: Reject an existing version or source tag
        run: python tools/container_release.py preflight --published
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build a candidate once without changing release tags
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          tags: ${{ steps.metadata.outputs.image }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.version=${{ steps.metadata.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Verify the candidate digest on both platforms
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            docker pull --platform "$platform" "$IMAGE@$DIGEST"
            python tools/container_lifecycle_smoke.py --image "$IMAGE@$DIGEST" --platform "$platform" --expected-version "$VERSION" \
              --seed-image ghcr.io/agent-memory-lab/agent-memory@sha256:c4d1c54dcbc56205e62dd6770ed420ed30d74820110f7d14408c37bc4f1b1704 --seed-version 0.1.1
          done
      - name: Scan amd64 candidate before promotion
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ${{ steps.metadata.outputs.image }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: json
          output: trivy-amd64.json
          timeout: 10m
      - name: Scan arm64 candidate before promotion
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          skip-setup-trivy: true
          image-ref: ${{ steps.metadata.outputs.image }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: json
          output: trivy-arm64.json
          timeout: 10m
      - name: Recheck registry state before promoting the tested digest
        id: promote
        run: python tools/container_release.py preflight --published
      - name: Publish immutable release tags, advance latest only for a newer version
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.metadata.outputs.version }}
          ADVANCE_LATEST: ${{ steps.promote.outputs.advance_latest }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:$VERSION" --tag "$IMAGE:sha-$GITHUB_SHA" "$IMAGE@$DIGEST"
          if [ "$ADVANCE_LATEST" = true ]; then
            docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
            python tools/container_release.py verify --published --digest "$DIGEST" --verify-latest
          else
            python tools/container_release.py verify --published --digest "$DIGEST"
          fi
      - name: Preserve publication and vulnerability evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-package-metadata
          path: |
            ${{ runner.temp }}/published-package.json
            trivy-*.json
          if-no-files-found: warn

  python-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.publish.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r requirements/container-build.lock
      - name: Build and independently install all seven distributions
        run: python tools/package_gate.py --no-build-isolation --work-dir "$RUNNER_TEMP/python-release"
      - name: Stage the exact tested archives in a new draft release
        run: |
          python tools/publish_python_release.py stage --artifacts "$RUNNER_TEMP/python-release/artifacts" --version "$VERSION"
      - name: Download the draft attachments and verify their complete contents
        run: |
          gh release download "v$VERSION" --dir "$RUNNER_TEMP/downloaded-release"
          cmp "$RUNNER_TEMP/python-release/artifacts/release-manifest.json" \
            "$RUNNER_TEMP/downloaded-release/release-manifest.json"
          python tools/verify_release_artifacts.py --source-root . --artifacts "$RUNNER_TEMP/downloaded-release" --require-manifest
      - name: Publish the verified Alpha release
        run: gh release edit "v$VERSION" --draft=false --prerelease
      - name: Preserve packaging verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-python-verification
          path: |
            ${{ runner.temp }}/python-release/evidence.json
            ${{ runner.temp }}/python-release/artifacts/release-manifest.json
          if-no-files-found: warn
